<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<base target="_top">
<style>
  :root {
    --blue-900: #1a3a6b;
    --blue-700: #2563a8;
    --blue-600: #2f74c0;
    --blue-500: #3b82d6;
    --blue-050: #eef4fb;
    --blue-100: #dce8f7;
    --ink:      #1f2733;
    --ink-soft: #5a6675;
    --line:     #e2e8f0;
    --bg:       #f7f9fc;
    --white:    #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5;
  }

  header { background: var(--white); border-bottom: 2px solid var(--blue-700); padding: 0 32px; }
  .header-inner {
    max-width: 1520px; margin: 0 auto; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { font-size: 20px; font-weight: 700; color: var(--blue-900); letter-spacing: -0.02em; }
  .brand .sub { font-size: 12px; color: var(--ink-soft); }
  .header-right { display: flex; align-items: center; gap: 20px; }
  .help-link {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px; color: var(--blue-700); text-decoration: none;
  }
  .help-link:hover { text-decoration: underline; }
  .help-link svg { width: 14px; height: 14px; }

  .btn-primary {
    background: var(--blue-700); color: var(--white); border: none; border-radius: 6px;
    padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-primary:hover { background: var(--blue-900); }

  main { max-width: 1520px; margin: 0 auto; padding: 28px 32px; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .toolbar .count { font-size: 13px; color: var(--ink-soft); }
  .toolbar .count strong { color: var(--blue-700); }

  .board { background: var(--white); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--blue-050); color: var(--blue-900); font-size: 12.5px; font-weight: 700;
    text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--blue-100); white-space: nowrap;
  }
  tbody td { padding: 7px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafcff; }

  .col-num   { width: 48px;  text-align: center; color: var(--ink-soft); }
  .col-key   { width: 120px; }
  .col-title { width: 160px; }
  .col-time  { width: 150px; white-space: nowrap; color: var(--ink-soft); font-size: 13px; }
  .col-url   { width: 260px; }
  .col-act   { width: 460px; }

  .keyword {
    display: inline-block; background: var(--blue-050); color: var(--blue-700);
    font-weight: 600; font-size: 12.5px; padding: 3px 9px; border-radius: 5px;
  }
  .title-text { font-weight: 600; color: var(--ink); }

  .url-cell { display: flex; align-items: center; gap: 6px; max-width: 130px; }
  .url-ellipsis {
    font-size: 12.5px; color: var(--ink-soft); font-family: 'Consolas', monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .btn {
    border: 1px solid var(--blue-100); background: var(--white); color: var(--blue-700);
    border-radius: 5px; padding: 4px 9px; font-size: 12px; font-weight: 500;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .btn:hover { background: var(--blue-050); border-color: var(--blue-500); }
  .btn-strong { background: var(--blue-600); color: var(--white); border-color: var(--blue-600); }
  .btn-strong:hover { background: var(--blue-900); border-color: var(--blue-900); }

  .btn-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; padding: 0; flex: none;
    border: 1px solid var(--blue-100); background: var(--white); color: var(--blue-700);
    border-radius: 5px; cursor: pointer;
  }
  .btn-icon:hover { background: var(--blue-050); border-color: var(--blue-500); }
  .btn-icon svg { width: 14px; height: 14px; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(26,58,107,.35);
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--white); border-radius: 10px; width: 420px; max-width: 100%;
    box-shadow: 0 12px 40px rgba(26,58,107,.25); overflow: hidden;
  }
  .modal-header {
    padding: 18px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-header h3 { font-size: 15px; font-weight: 700; color: var(--blue-900); }
  .modal-close {
    border: none; background: none; cursor: pointer; color: var(--ink-soft);
    font-size: 18px; line-height: 1; padding: 4px;
  }
  .modal-close:hover { color: var(--ink); }
  .modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  .field input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 13.5px; font-family: inherit; color: var(--ink);
  }
  .field input:focus { outline: none; border-color: var(--blue-500); }
  .field input:disabled { background: var(--bg); color: var(--ink-soft); }
  .field .hint { margin-top: 4px; font-size: 11.5px; color: var(--ink-soft); }
  .field .hint.hint-error { color: #c0392b; font-weight: 600; white-space: pre-line; }
  .radio-group { display: flex; flex-direction: column; gap: 6px; }
  .radio-option { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink); font-weight: 400; cursor: pointer; }
  .radio-option input { width: auto; margin: 0; }
  .modal-footer {
    padding: 14px 22px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .modal-footer .footer-right { display: flex; gap: 8px; }
  .btn-ghost {
    border: 1px solid var(--line); background: var(--white); color: var(--ink-soft);
    border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .btn-ghost:hover { background: var(--bg); }
  .btn-danger {
    border: 1px solid #c0392b; background: var(--white); color: #c0392b;
    border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .btn-danger:hover { background: #fdecea; }

  .field textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 13.5px; font-family: inherit; color: var(--ink); resize: vertical;
  }
  .field textarea:focus { outline: none; border-color: var(--blue-500); }
  .survey-option-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .survey-option-num { width: 20px; flex: none; font-size: 13px; font-weight: 600; color: var(--ink-soft); text-align: right; }
  .survey-option-row input {
    flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 13.5px; font-family: inherit; color: var(--ink);
  }
  .survey-session-body { align-items: center; text-align: center; }
  .survey-key { font-size: 28px; font-weight: 800; letter-spacing: 4px; color: var(--blue-700); }
  .survey-elapsed { font-size: 13px; color: var(--ink-soft); }
  .bar-row { margin-bottom: 10px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 3px; }
  .bar-track { background: var(--bg); border-radius: 4px; overflow: hidden; height: 10px; }
  .bar-fill { height: 100%; background: var(--line); }
  .opinion-box { white-space: pre-line; background: var(--bg); padding: 10px; border-radius: 6px; font-size: 13px; }

  .empty { padding: 60px 20px; text-align: center; color: var(--ink-soft); }
  .loading { padding: 60px 20px; text-align: center; color: var(--ink-soft); }

  #toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--blue-900); color: var(--white);
    padding: 10px 20px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<script>
  // ===== 서버에서 강의 목록 로드 =====
  function loadList() {
    google.script.run
      .withSuccessHandler(renderList)
      .withFailureHandler(function (err) {
        document.getElementById('lectureList').innerHTML =
          '<tr><td colspan="6"><div class="empty">목록을 불러오지 못했습니다: ' +
          esc(err.message) + '</div></td></tr>';
      })
      .getLectureList();
  }

  // 아이콘 버튼용 SVG (URL 복사 / 뷰어 열기) - 마우스오버 시 title 속성이 풍선도움말로 표시됨
  var ICON_COPY =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect>' +
    '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
  var ICON_OPEN =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>' +
    '<polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';

  var lectureData = [];
  var currentModalMode = 'new';
  var currentExamKeyword = null;

  function renderList(data) {
    lectureData = data;
    var tbody = document.getElementById('lectureList');
    document.getElementById('totalCount').textContent = data.length;

    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty">' +
        '아직 배포된 강의가 없습니다. 우측 상단 [새 강의 추가하기]로 시작하세요.' +
        '</div></td></tr>';
      return;
    }

    tbody.innerHTML = data.map(function (row, i) {
      return '<tr>' +
        '<td class="col-num">' + (i + 1) + '</td>' +
        '<td><span class="keyword">' + esc(row.keyword) + '</span></td>' +
        '<td><span class="title-text">' + esc(row.title) + '</span></td>' +
        '<td class="col-time">' + esc(row.updated) + '</td>' +
        '<td><div class="url-cell"><span class="url-ellipsis" title="' + esc(row.viewerUrl) + '">' +
            shortUrl(row.viewerUrl) + '</span></div></td>' +
        '<td><div class="actions">' +
          '<button class="btn-icon" title="URL 복사" onclick="copyUrl(\'' + esc(row.viewerUrl) + '\')">' + ICON_COPY + '</button>' +
          '<button class="btn-icon" title="뷰어 열기" onclick="openViewer(\'' + esc(row.viewerUrl) + '\')">' + ICON_OPEN + '</button>' +
          '<button class="btn" onclick="editDeploy(\'' + esc(row.keyword) + '\')">배포 수정</button>' +
          '<button class="btn" onclick="makeQuiz(\'' + esc(row.keyword) + '\')">시험문제 생성</button>' +
          '<button class="btn" onclick="makeVirtualQuestions(\'' + esc(row.keyword) + '\')">가상질문 생성</button>' +
          '<button class="btn btn-strong" onclick="openSurvey(\'' + esc(row.keyword) + '\')">실시간 설문</button>' +
          '<button class="btn" onclick="evaluateMaterial(\'' + esc(row.keyword) + '\')">강의자료 평가</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  function shortUrl(url) {
    if (!url) return '<span style="color:#b0b8c4">미설정</span>';
    if (url.length <= 28) return esc(url);
    return esc(url.slice(0, 24)) + '…';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // ===== 버튼 동작 (실제 연동은 이후 단계) =====
  function copyUrl(url) {
    if (!url) { showToast('뷰어 URL이 아직 설정되지 않았습니다'); return; }
    var ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('뷰어 URL을 복사했습니다'); }
    catch (e) { showToast('복사에 실패했습니다'); }
    document.body.removeChild(ta);
  }
  function openViewer(url) {
    if (!url) { showToast('뷰어 URL이 아직 설정되지 않았습니다'); return; }
    window.open(url, '_blank');
  }
  // ===== AI 활용 기능 공용 게이트 (시험문제 생성 / 가상질문 생성 / 강의자료 평가) =====
  // 오류가 있거나, 개발이 완료되지 않은 기능이거나, 관리자가 AI_MODE를 꺼두었으면
  // 이 안내 모달만 띄우고 아무 동작도 하지 않는다.
  function showAiCreditModal() {
    showConfirmModal('AI 기능을 이용하려면 AI 크레딧이 필요합니다.', { alertOnly: true });
  }

  /** 서버의 AI_MODE 설정을 확인해 callback(enabled)을 호출한다. 확인 자체가 실패해도 꺼진 것으로 처리. */
  function checkAiEnabled_(callback) {
    google.script.run
      .withSuccessHandler(callback)
      .withFailureHandler(function () { callback(false); })
      .isAiEnabled();
  }

  /** 아직 개발이 완료되지 않은 AI 기능 버튼(가상질문 생성·강의자료 평가) 공용 처리. */
  function showAiFeatureNotReady_() {
    showAiCreditModal();
  }

  function makeVirtualQuestions(key) {
    showAiFeatureNotReady_();
  }

  function evaluateMaterial(key) {
    showAiFeatureNotReady_();
  }

  // ===== 시험문제 생성 =====
  function makeQuiz(key) {
    checkAiEnabled_(function (enabled) {
      if (!enabled) { showAiCreditModal(); return; }
      currentExamKeyword = key;
      document.getElementById('examCount').value = 3;
      document.querySelector('input[name="examProvider"][value="gemini"]').checked = true;
      document.querySelector('input[name="examType"][value="multiple_choice"]').checked = true;
      var btn = document.getElementById('examGenerateBtn');
      btn.disabled = false;
      btn.textContent = '생성';
      document.getElementById('examCreateOverlay').classList.add('show');
    });
  }

  function closeExamCreate() {
    document.getElementById('examCreateOverlay').classList.remove('show');
  }

  function generateExam() {
    var provider = document.querySelector('input[name="examProvider"]:checked').value;
    var type = document.querySelector('input[name="examType"]:checked').value;
    var count = parseInt(document.getElementById('examCount').value, 10);
    if (!count || count < 1) { showToast('개수를 올바르게 입력하세요'); return; }

    var btn = document.getElementById('examGenerateBtn');
    btn.disabled = true;
    btn.textContent = '생성 중…';

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = '생성';
        if (result && result.error) { closeExamCreate(); showAiCreditModal(); return; }
        closeExamCreate();
        openExamResultWindow(result);
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = '생성';
        closeExamCreate();
        showAiCreditModal();
      })
      .generateExamQuestions(currentExamKeyword, type, count, provider);
  }

  /** 생성된 시험문제를 복사해서 쓰기 좋은 형태로 새 창에 출력한다(보관은 안 함, 일회성). */
  function openExamResultWindow(result) {
    var questions = (result && result.questions) || [];
    var win = window.open('', '_blank');
    if (!win) {
      showConfirmModal('새 창이 차단되었습니다. 브라우저의 팝업 차단을 해제해 주세요.', { alertOnly: true });
      return;
    }

    var body;
    if (!questions.length) {
      body = '<p>생성된 문제가 없습니다.</p>';
    } else {
      var questionsHtml = questions.map(function (q, i) {
        var block = '<p>' + (i + 1) + '. ' + esc(q.question_text) + '</p>';
        if (q.options && q.options.length) {
          block += '<ol type="1">' +
            q.options.map(function (o) { return '<li>' + esc(o) + '</li>'; }).join('') +
            '</ol>';
        }
        return '<div class="q">' + block + '</div>';
      }).join('');

      var answerHtml = '<ol>' +
        questions.map(function (q) { return '<li>' + esc(q.correct_answer) + '</li>'; }).join('') +
        '</ol>';

      body =
        '<h2>시험문제</h2>' + questionsHtml +
        '<hr>' +
        '<h2>정답</h2>' + answerHtml;
    }

    win.document.open();
    win.document.write(
      '<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">' +
      '<title>생성된 시험문제</title>' +
      '<style>' +
      'body{font-family:"Malgun Gothic",sans-serif;max-width:720px;margin:40px auto;padding:0 20px;color:#1f2733;line-height:1.6;}' +
      'h2{font-size:16px;border-bottom:2px solid #2563a8;padding-bottom:6px;margin-top:32px;}' +
      '.q{margin-bottom:16px;}' +
      'ol{margin:4px 0 0 0;padding-left:24px;}' +
      '</style></head><body>' +
      body +
      '</body></html>'
    );
    win.document.close();
  }

  // ===== 실시간 설문 =====
  var currentSurveyKeyword = null;
  var currentSurveyQuestionId = null;
  var surveyElapsedTimer = null;
  var surveyStartedAt = null;

  function openSurvey(key) {
    currentSurveyKeyword = key;
    document.getElementById('surveyQuestionText').value = '';
    document.getElementById('surveyCorrectAnswers').value = '';
    document.querySelector('input[name="surveyType"][value="multiple_choice"]').checked = true;
    resetSurveyOptions();
    onSurveyTypeChange();
    var btn = document.getElementById('surveyPublishBtn');
    btn.disabled = false;
    btn.textContent = '학생들에게 공개';
    document.getElementById('surveyCreateOverlay').classList.add('show');
  }

  function closeSurveyCreate() {
    document.getElementById('surveyCreateOverlay').classList.remove('show');
  }

  function resetSurveyOptions() {
    document.getElementById('surveyOptionsList').innerHTML = '';
    addSurveyOption();
    addSurveyOption();
  }

  function addSurveyOption() {
    var row = document.createElement('div');
    row.className = 'survey-option-row';

    var num = document.createElement('span');
    num.className = 'survey-option-num';

    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'survey-option-input';

    var delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'btn-icon';
    delBtn.title = '삭제';
    delBtn.textContent = '×';
    delBtn.onclick = function () { row.remove(); renumberSurveyOptions(); };

    row.appendChild(num);
    row.appendChild(input);
    row.appendChild(delBtn);
    document.getElementById('surveyOptionsList').appendChild(row);
    renumberSurveyOptions();
  }

  /** 보기 번호가 정답 판정 기준이므로, 추가·삭제할 때마다 실제 순서로 다시 매긴다. */
  function renumberSurveyOptions() {
    var rows = document.querySelectorAll('#surveyOptionsList .survey-option-row');
    rows.forEach(function (row, i) {
      row.querySelector('.survey-option-num').textContent = (i + 1) + '.';
      row.querySelector('.survey-option-input').placeholder = '보기 ' + (i + 1);
    });
  }

  function onSurveyTypeChange() {
    var type = document.querySelector('input[name="surveyType"]:checked').value;
    document.getElementById('surveyOptionsField').style.display = (type === 'multiple_choice') ? '' : 'none';
    // 의견형은 정답을 입력받지 않고 채점도 하지 않는다 - 정답입력란 자체를 숨긴다.
    document.getElementById('surveyAnswerField').style.display = (type === 'opinion') ? 'none' : '';

    var input = document.getElementById('surveyCorrectAnswers');
    var hint = document.getElementById('surveyAnswerHint');
    if (type === 'multiple_choice') {
      input.placeholder = '정답 보기 번호(여러 개면 쉼표로 구분, 예: 1,3)';
      hint.textContent = '학생 제출도 번호로 처리되어 이 번호와 일치하면 정답 처리됩니다.';
    } else {
      input.placeholder = '여러 개면 쉼표로 구분 (예: 사과,Apple)';
      hint.textContent = '제출된 답이 이 중 하나와 일치하면(공백·대소문자 무시) 정답 처리됩니다.';
    }
  }

  function publishSurvey() {
    var type = document.querySelector('input[name="surveyType"]:checked').value;
    var questionText = document.getElementById('surveyQuestionText').value.trim();
    if (!questionText) { showToast('질문을 입력하세요'); return; }

    var options = null;
    if (type === 'multiple_choice') {
      options = Array.prototype.slice.call(document.querySelectorAll('.survey-option-input'))
        .map(function (el) { return el.value.trim(); })
        .filter(function (v) { return v; });
      if (options.length < 2) { showToast('선택보기를 2개 이상 입력하세요'); return; }
    }

    var correctAnswersCsv = '';
    if (type !== 'opinion') {
      correctAnswersCsv = document.getElementById('surveyCorrectAnswers').value.trim();
      if (!correctAnswersCsv) { showToast('정답을 입력하세요'); return; }
    }

    var btn = document.getElementById('surveyPublishBtn');
    btn.disabled = true;
    btn.textContent = '공개 중…';

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = '학생들에게 공개';
        closeSurveyCreate();
        openSurveySession(result);
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = '학생들에게 공개';
        showToast('설문 공개 실패: ' + err.message);
      })
      .createSurvey(currentSurveyKeyword, questionText, type, options, correctAnswersCsv);
  }

  function openSurveySession(result) {
    currentSurveyQuestionId = result.id;
    surveyStartedAt = new Date(result.started_at).getTime();

    var footer = document.getElementById('surveySessionFooter');
    footer.innerHTML = '<button class="btn-danger" onclick="endSurveyConfirm()">설문종료</button>';

    document.getElementById('surveyAccessKey').textContent = result.access_key;
    document.getElementById('surveySessionOverlay').classList.add('show');
    updateSurveyElapsed();
    clearInterval(surveyElapsedTimer);
    surveyElapsedTimer = setInterval(updateSurveyElapsed, 1000);
  }

  function updateSurveyElapsed() {
    var sec = Math.max(0, Math.floor((Date.now() - surveyStartedAt) / 1000));
    var mm = ('0' + Math.floor(sec / 60)).slice(-2);
    var ss = ('0' + (sec % 60)).slice(-2);
    document.getElementById('surveyElapsed').textContent = '경과 ' + mm + ':' + ss;
  }

  /** 진행 모달은 이 버튼 외에는 닫히지 않는다(오버레이 바깥 클릭·닫기버튼 없음). */
  function endSurveyConfirm() {
    showConfirmModal('설문을 종료하시겠습니까?\n\n종료하면 더 이상 답변을 받지 않고, 지금까지 모인 답변을 집계합니다.').then(function (ok) {
      if (!ok) return;

      clearInterval(surveyElapsedTimer);
      document.getElementById('surveySessionFooter').innerHTML = '<span class="hint">결과를 집계하는 중…</span>';

      google.script.run
        .withSuccessHandler(function (result) {
          document.getElementById('surveySessionOverlay').classList.remove('show');
          renderSurveyResult(result);
        })
        .withFailureHandler(function (err) {
          document.getElementById('surveySessionOverlay').classList.remove('show');
          showToast('설문 종료 처리 실패: ' + err.message);
        })
        .finishSurvey(currentSurveyQuestionId);
    });
  }

  function renderSurveyResult(r) {
    var html = '<div style="font-weight:600;margin-bottom:10px;">' + esc(r.question_text) + '</div>';

    if (r.question_type === 'opinion') {
      if (r.opinion_summary) {
        html += '<div class="hint" style="margin-bottom:6px;">AI 요약</div>' +
          '<div class="opinion-box">' + esc(r.opinion_summary) + '</div>';
      } else {
        html += '<div class="hint hint-error" style="margin-bottom:6px;">AI 요약에 실패하여 학생 답변 원문을 표시합니다.</div>' +
          '<ol style="padding-left:20px;">' +
          (r.opinion_raw || []).map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') +
          '</ol>';
      }
    } else if (!r.total_responses) {
      html += '<div class="hint">제출된 답변이 없습니다.</div>';
    } else {
      html += '<div class="hint" style="margin-bottom:10px;">응답 ' + r.total_responses + '건 · 정답률 ' + r.accuracy_rate + '%</div>';

      // 막대 색상: 정답 = 파랑, 오답 중 최다 응답 = 빨강, 나머지 오답 = 파스텔톤 순환.
      var dist = r.answer_distribution || [];
      var maxWrongCount = 0;
      dist.forEach(function (d) {
        if (!d.is_correct && d.count > maxWrongCount) maxWrongCount = d.count;
      });
      var pastelPalette = ['#ffcc80', '#ce93d8', '#a5d6a7', '#fff59d', '#80cbc4', '#f48fb1', '#b39ddb', '#9fa8da'];
      var pastelIdx = 0;

      dist.forEach(function (d) {
        var barColor;
        if (d.is_correct) {
          barColor = 'var(--blue-600)';
        } else if (maxWrongCount > 0 && d.count === maxWrongCount) {
          barColor = '#ef5350';
        } else {
          barColor = pastelPalette[pastelIdx % pastelPalette.length];
          pastelIdx++;
        }
        html += '<div class="bar-row">' +
          '<div class="bar-label"><span>' + esc(d.label) + (d.is_correct ? ' ✓' : '') + '</span>' +
          '<span>' + d.count + '건 (' + d.ratio + '%)</span></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + d.ratio + '%;background:' + barColor + ';"></div></div>' +
          '</div>';
      });
    }

    document.getElementById('surveyResultBody').innerHTML = html;
    document.getElementById('surveyResultOverlay').classList.add('show');
  }

  function closeSurveyResult() {
    showConfirmModal('결과 창을 닫으면 다시 볼 수 없습니다. 닫으시겠습니까?').then(function (ok) {
      if (!ok) return;
      document.getElementById('surveyResultOverlay').classList.remove('show');
    });
  }

  // ===== 새 강의 추가 / 배포 수정 모달 =====
  function openNewLecture() { openLectureModal('new', null); }

  function editDeploy(key) {
    var item = lectureData.filter(function (r) { return r.keyword === key; })[0];
    if (!item) { showToast('강의 정보를 찾을 수 없습니다'); return; }
    openLectureModal('edit', item);
  }

  function openLectureModal(mode, item) {
    currentModalMode = mode;
    var kwInput    = document.getElementById('fieldKeyword');
    var titleInput = document.getElementById('fieldTitle');
    var urlInput   = document.getElementById('fieldUrl');
    var hint       = document.getElementById('keywordHint');
    var urlHint    = document.getElementById('urlHint');
    var submitBtn  = document.getElementById('modalSubmitBtn');
    var deleteBtn  = document.getElementById('modalDeleteBtn');

    document.getElementById('modalTitle').textContent = mode === 'edit' ? '배포 수정' : '새 강의 추가';
    kwInput.value = mode === 'edit' ? item.keyword : '';
    titleInput.value = mode === 'edit' ? item.title : '';
    urlInput.value = '';
    urlInput.placeholder = (mode === 'edit' && item.sourceUrl)
      ? item.sourceUrl
      : 'https://docs.google.com/presentation/d/...';
    kwInput.disabled = (mode === 'edit');
    deleteBtn.style.display = (mode === 'edit') ? '' : 'none';
    deleteBtn.disabled = false;
    deleteBtn.textContent = '배포 삭제';
    clearUrlError();
    hint.classList.remove('hint-error');
    hint.textContent = mode === 'edit'
      ? '배포 수정에서는 키워드를 바꿀 수 없습니다.'
      : '뷰어 주소(?k=키워드)에 고정으로 쓰입니다. 이미 있는 키워드는 등록할 수 없습니다(수정은 목록의 "배포 수정" 이용).';
    urlHint.textContent = mode === 'edit'
      ? '슬라이드 URL을 비워두면 제목만 바뀌고 슬라이드·목차는 그대로 유지됩니다. URL을 입력하면 그 슬라이드로 다시 배포되며 목차도 새로 생성됩니다.'
      : '공개하고자 하는 구글슬라이드 파일을 열어 주소창에 표시되는 URL을 복사해서 붙여넣기 하세요.';

    var tocMethodRadios = document.getElementsByName('tocMethod');
    for (var i = 0; i < tocMethodRadios.length; i++) {
      tocMethodRadios[i].checked = (tocMethodRadios[i].value === 'title');
    }

    submitBtn.disabled = false;

    document.getElementById('lectureModalOverlay').classList.add('show');
    (mode === 'edit' ? urlInput : kwInput).focus();
  }

  function closeLectureModal() {
    document.getElementById('lectureModalOverlay').classList.remove('show');
  }

  /** URL 필드 아래 에러 메시지를 숨긴다. 사용자가 URL을 다시 손대면 호출됨. */
  function clearUrlError() {
    var urlError = document.getElementById('urlError');
    urlError.style.display = 'none';
    urlError.textContent = '';
  }

  /** URL 필드 아래에 배포 실패 메시지를 표시한다(줄바꿈 그대로 유지). */
  function showUrlError(msg) {
    var urlError = document.getElementById('urlError');
    urlError.textContent = msg;
    urlError.style.display = 'block';
  }

  /** 신규 등록 모드에서 키워드가 이미 목록에 있으면 즉시 경고 표시 + 배포 버튼 비활성화. */
  function onKeywordInput() {
    if (currentModalMode !== 'new') return;
    var kw = document.getElementById('fieldKeyword').value.trim();
    var hint = document.getElementById('keywordHint');
    var submitBtn = document.getElementById('modalSubmitBtn');
    var dup = kw && lectureData.some(function (r) { return r.keyword === kw; });

    if (dup) {
      hint.textContent = '이미 등록된 키워드입니다. 새로 등록할 수 없습니다 — 기존 강의는 목록의 "배포 수정"으로 변경하세요.';
      hint.classList.add('hint-error');
      submitBtn.disabled = true;
    } else {
      hint.textContent = '뷰어 주소(?k=키워드)에 고정으로 쓰입니다. 이미 있는 키워드는 등록할 수 없습니다(수정은 목록의 "배포 수정" 이용).';
      hint.classList.remove('hint-error');
      submitBtn.disabled = false;
    }
  }

  function submitLecture() {
    var keyword = document.getElementById('fieldKeyword').value.trim();
    var title = document.getElementById('fieldTitle').value.trim();
    var url = document.getElementById('fieldUrl').value.trim();
    var tocMethodInput = document.querySelector('input[name="tocMethod"]:checked');
    var tocMethod = tocMethodInput ? tocMethodInput.value : 'title';

    if (!keyword || !title) {
      showToast('키워드와 제목을 모두 입력하세요');
      return;
    }
    if (currentModalMode === 'new' && !url) {
      showToast('키워드, 제목, URL을 모두 입력하세요');
      return;
    }

    if (currentModalMode === 'new' && lectureData.some(function (r) { return r.keyword === keyword; })) {
      showToast('이미 등록된 키워드입니다. 배포 수정으로 진행하세요.');
      return;
    }

    if (currentModalMode === 'edit') {
      var confirmMsg = url
        ? ('"' + keyword + '"의 배포 내용을 새 슬라이드로 갱신합니다.\n\n' +
            '- 목차가 지금 입력한 슬라이드 기준으로 새로 생성됩니다.\n' +
            '- 뷰어 주소(?k=' + keyword + ')는 그대로 유지되고, 내용만 갱신됩니다.\n\n' +
            '계속하시겠습니까?')
        : ('"' + keyword + '"의 제목만 "' + title + '"(으)로 수정합니다.\n\n' +
            '- 슬라이드와 목차는 그대로 유지되며 다시 추출하지 않습니다.\n\n' +
            '계속하시겠습니까?');
      showConfirmModal(confirmMsg).then(function (okEdit) {
        if (!okEdit) return;
        doDeployLecture_(url, keyword, title, tocMethod);
      });
      return;
    }

    doDeployLecture_(url, keyword, title, tocMethod);
  }

  function doDeployLecture_(url, keyword, title, tocMethod) {
    clearUrlError();
    var btn = document.getElementById('modalSubmitBtn');
    btn.disabled = true;
    btn.textContent = '배포 중…';

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = '배포';
        closeLectureModal();
        showToast('"' + result.title + '" 배포 완료');
        loadList();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = '배포';
        showUrlError(err.message);
      })
      .deployLecture(url, keyword, title, currentModalMode === 'new', tocMethod);
  }

  /** "배포 수정" 모달의 [삭제] 버튼: 배포를 내린다(슬라이드 파일 자체는 유지). */
  function deleteLectureConfirm() {
    var keyword = document.getElementById('fieldKeyword').value.trim();
    showConfirmModal(
      '"' + keyword + '" 배포를 삭제하시겠습니까?\n\n' +
      '- 슬라이드 파일 자체는 삭제되지 않지만, 공유 범위가 "내부(공유 드라이브 멤버)만 접근 가능"으로 바뀌어 공개 링크로는 더 이상 열리지 않습니다.\n' +
      '- 저장된 목차(json) 파일이 삭제됩니다.\n' +
      '- 뷰어 주소(?k=' + keyword + ')는 더 이상 동작하지 않으며, 강의 목록에서도 사라집니다.\n\n' +
      '계속하시겠습니까?',
      { danger: true, okText: '삭제' }
    ).then(function (ok) {
      if (!ok) return;

      var delBtn = document.getElementById('modalDeleteBtn');
      delBtn.disabled = true;
      delBtn.textContent = '삭제 중…';

      google.script.run
        .withSuccessHandler(function () {
          closeLectureModal();
          showToast('"' + keyword + '" 배포를 삭제했습니다');
          loadList();
        })
        .withFailureHandler(function (err) {
          delBtn.disabled = false;
          delBtn.textContent = '삭제';
          showUrlError(err.message);
        })
        .deleteLecture(keyword);
    });
  }

  // ===== 공용 확인 모달 (alert()/confirm() 대체) =====
  // 사용법: showConfirmModal(메시지, {alertOnly, danger, okText}).then(function (ok) { ... });
  var confirmModalResolve_ = null;

  function showConfirmModal(message, options) {
    options = options || {};
    document.getElementById('confirmModalMessage').textContent = message;
    document.getElementById('confirmModalCancelBtn').style.display = options.alertOnly ? 'none' : '';
    var okBtn = document.getElementById('confirmModalOkBtn');
    okBtn.textContent = options.okText || '확인';
    okBtn.className = options.danger ? 'btn-danger' : 'btn-primary';
    document.getElementById('confirmModalOverlay').classList.add('show');
    return new Promise(function (resolve) {
      confirmModalResolve_ = resolve;
    });
  }

  function resolveConfirmModal_(result) {
    document.getElementById('confirmModalOverlay').classList.remove('show');
    var resolve = confirmModalResolve_;
    confirmModalResolve_ = null;
    if (resolve) resolve(result);
  }

  var toastTimer;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2000);
  }

  // 초기 로드
  loadList();
</script>
</body>
</html>
